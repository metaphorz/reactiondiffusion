                            <button onClick={() => setIsRunning(!isRunning)}>
                                {isRunning ? 'Pause' : 'Play'}
                            </button>
                            <button className="secondary" onClick={reset}>Reset</button>
                        </div>

                        <div className="control-group">
                            <label>Initial Pattern</label>
                            <select value={initialPattern} onChange={(e) => {
                                const newPattern = e.target.value;
                                setInitialPattern(newPattern);
                                setIsRunning(false);
                                initializeGrids(newPattern);
                            }}>
                                <option value="center">Center Spot</option>
                                <option value="sparse">Sparse Seeds (best for self-replicating)</option>
                                <option value="random">Random Noise</option>
                                <option value="grid">Grid</option>
                                <option value="stripes">Stripes</option>
                                <option value="corners">Four Corners</option>
                                <option value="ring">Ring</option>
                                <option value="diagonal">Diagonal</option>
                            </select>
                        </div>

                        {mode === 'turing' && (
                            <>
                                <h2>Gray-Scott Parameters</h2>

                                <div className="control-group">
                                    <label>Presets (24 patterns from Webb's collection)</label>
                                    <select onChange={(e) => applyPreset(e.target.value)} defaultValue="">
                                        <option value="">-- Select a Preset --</option>
                                        <option value="waves">Waves</option>
                                        <option value="moving-spots">Moving Spots</option>
                                        <option value="spots-loops">Spots and Loops</option>
                                        <option value="warring-microbes">Warring Microbes</option>
                                        <option value="pulsating-solitons">Pulsating Solitons</option>
                                        <option value="chaos">Chaos</option>
                                        <option value="mazes-chaos">Mazes with Chaos</option>
                                        <option value="mazes">Mazes</option>
                                        <option value="super-resonant-mazes">Super-Resonant Mazes</option>
                                        <option value="self-replicating-spots">Self-Replicating Spots</option>
                                        <option value="spots-worms">Spots and Worms</option>
                                        <option value="chaos-negatons">Chaos with Negatons</option>
                                        <option value="fingerprints">Fingerprints</option>
                                        <option value="chaos-turing-negatons">Chaos to Turing Negatons</option>
                                        <option value="turing-patterns">Turing Patterns</option>
                                        <option value="negatons">Negatons</option>
                                        <option value="worms-join-maze">Worms Join into Maze</option>
                                        <option value="worms">Worms</option>
                                        <option value="u-skate-world">The U-Skate World</option>
                                        <option value="stable-solitons">Stable Solitons</option>
                                        <option value="worms-loops">Worms and Loops</option>
                                        <option value="precritical-bubbles">Precritical Bubbles</option>
                                        <option value="positive-bubbles">Positive Bubbles</option>
                                        <option value="negative-bubbles">Negative Bubbles</option>
                                    </select>
                                </div>

                                <div className="control-group">
                                    <label>
                                        Diffusion Rate U (Du / dA)
                                        <span className="value-display">{Du.toFixed(4)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.2"
                                        max="0.25"
                                        step="0.0001"
                                        value={Du}
                                        onChange={(e) => setDu(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Diffusion Rate V (Dv / dB)
                                        <span className="value-display">{Dv.toFixed(4)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.01"
                                        max="0.8"
                                        step="0.001"
                                        value={Dv}
                                        onChange={(e) => setDv(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Feed Rate (F)
                                        <span className="value-display">{feedRate.toFixed(4)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.01"
                                        max="0.1"
                                        step="0.001"
                                        value={feedRate}
                                        onChange={(e) => setFeedRate(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Kill Rate (k)
                                        <span className="value-display">{killRate.toFixed(4)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.01"
                                        max="0.1"
                                        step="0.001"
                                        value={killRate}
                                        onChange={(e) => setKillRate(parseFloat(e.target.value))}
                                    />
                                </div>
                            </>
                        )}

                        {mode === 'diffusiophoresis' && (
                            <>
                                <h2>Diffusiophoresis Parameters</h2>

                                <div className="control-group">
                                    <label>
                                        Diffusion Coefficient
                                        <span className="value-display">{diffusionCoeff.toFixed(3)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.01"
                                        max="0.5"
                                        step="0.01"
                                        value={diffusionCoeff}
                                        onChange={(e) => setDiffusionCoeff(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Gradient Strength
                                        <span className="value-display">{gradientStrength.toFixed(3)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0"
                                        max="2"
                                        step="0.05"
                                        value={gradientStrength}
                                        onChange={(e) => setGradientStrength(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Particle Mobility
                                        <span className="value-display">{mobility.toFixed(3)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0"
                                        max="1"
                                        step="0.05"
                                        value={mobility}
                                        onChange={(e) => setMobility(parseFloat(e.target.value))}
                                    />
                                </div>
                            </>
                        )}

                        <h2>Visualization</h2>

                        <div className="button-group">
                            <button
                                className={isPainting ? 'secondary' : ''}
                                onClick={() => setIsPainting(!isPainting)}
                            >
                                {isPainting ? '🖌️ Paint Mode ON' : '🖌️ Paint Mode OFF'}
                            </button>
                            <button
                                className="secondary"
                                onClick={() => setIsFullscreen(!isFullscreen)}
                            >
                                {isFullscreen ? '⛶ Exit Fullscreen' : '⛶ Fullscreen'}
                            </button>
                        </div>

                        {isPainting && (
                            <>
                                <div className="control-group">
                                    <label>
                                        Brush Size
                                        <span className="value-display">{brushSize}px</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="5"
                                        max="100"
                                        step="1"
                                        value={brushSize}
                                        onChange={(e) => setBrushSize(parseInt(e.target.value))}
                                    />
                                </div>

                                <div className="control-group">
                                    <label>
                                        Brush Strength
                                        <span className="value-display">{brushStrength.toFixed(2)}</span>
                                    </label>
                                    <input
                                        type="range"
                                        min="0.1"
                                        max="2.0"
                                        step="0.1"
                                        value={brushStrength}
                                        onChange={(e) => setBrushStrength(parseFloat(e.target.value))}
                                    />
                                </div>
                            </>
                        )}

                        <div className="control-group">
                            <label>Color Scheme</label>
                            <select value={colorScheme} onChange={(e) => setColorScheme(e.target.value)}>
                                <option value="viridis">Viridis</option>
                                <option value="plasma">Plasma</option>
                                <option value="rainbow">Rainbow (Full Spectrum)</option>
                                <option value="grayscale">Grayscale</option>
                            </select>
                        </div>

                        <div className="control-group">
                            <label style={{ display: 'flex', alignItems: 'center', cursor: 'pointer' }}>
                                <input
                                    type="checkbox"
                                    checked={highContrast}
                                    onChange={(e) => setHighContrast(e.target.checked)}
                                    style={{ marginRight: '8px', cursor: 'pointer' }}
                                />
                                High Contrast Mode
                            </label>
                        </div>

                        <div className="control-group">
                            <label>
                                Speed (Timestep Multiplier)
                                <span className="value-display">{speed}x</span>
                            </label>
                            <input
                                type="range"
                                min="1"
                                max="10"
                                step="1"
                                value={speed}
                                onChange={(e) => setSpeed(parseInt(e.target.value))}
                            />
                        </div>

                        <div className="control-group">
                            <label>
                                Steps Per Frame
                                <span className="value-display">{iterationsPerFrame}</span>
                            </label>
                            <input
                                type="range"
                                min="1"
                                max="20"
                                step="1"
                                value={iterationsPerFrame}
                                onChange={(e) => setIterationsPerFrame(parseInt(e.target.value))}
                            />
                        </div>

                        <div className="control-group">
                            <label>
                                Zoom
                                <span className="value-display">{zoom.toFixed(1)}x</span>
                            </label>
                            <input
                                type="range"
                                min="1"
                                max="20"
                                step="0.1"
                                value={zoom}
                                onChange={(e) => setZoom(parseFloat(e.target.value))}
                            />
                        </div>

                        <button className="secondary" onClick={resetView}>Reset View</button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ReactionDiffusionSimulator />, document.getElementById('root'));
    </script>
</body>
</html>
