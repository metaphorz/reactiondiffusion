<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction-Diffusion Simulator (GPU Accelerated)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 1400px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        .container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #1a1a1a;
            margin: 0;
            padding: 0;
            gap: 0;
        }

        .canvas-container {
            flex: 1;
            min-width: 300px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .container.fullscreen .canvas-container {
            width: 100%;
            height: 100%;
            max-width: none;
            border-radius: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .container.fullscreen .canvas-container h1,
        .container.fullscreen .canvas-container .gpu-badge {
            display: none;
        }

        .container.fullscreen .controls {
            display: none;
        }

        .container.fullscreen canvas {
            max-width: 100vw;
            max-height: 100vh;
            width: auto !important;
            height: auto !important;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background: #000;
        }

        .controls {
            width: 350px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #fff;
        }

        .gpu-badge {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            color: #4a9eff;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4a9eff;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4a9eff;
            cursor: pointer;
            border: none;
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #333;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background: #4a9eff;
            color: #fff;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a8eef;
        }

        button.secondary {
            background: #555;
        }

        button.secondary:hover {
            background: #666;
        }

        .value-display {
            display: inline-block;
            float: right;
            color: #4a9eff;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
        }

        .error-message {
            background: #ff4444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        .fullscreen-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #4a9eff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .canvas-wrapper:hover .fullscreen-hint {
            opacity: 1;
        }

        .container.fullscreen .fullscreen-hint {
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function ReactionDiffusionSimulator() {
            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const gpuRef = useRef(null);

            // CPU simulation grids
            const cpuGridA = useRef(null);
            const cpuGridB = useRef(null);
            const cpuNextGridA = useRef(null);
            const cpuNextGridB = useRef(null);

            // Simulation state
            const [isRunning, setIsRunning] = useState(false);
            const [mode, setMode] = useState('turing');
            const [useBackend, setUseBackend] = useState('cpu'); // 'cpu' or 'gpu' - default to CPU for testing
            const [gridSize] = useState(256); // 256x256 grid matching Webb's implementation for stability
            const [gpuError, setGpuError] = useState(null);

            // Turing parameters - matched to Jason Webb's defaults for better pattern variety
            const [Du, setDu] = useState(0.2097);  // dA in Webb's (was 0.16)
            const [Dv, setDv] = useState(0.105);   // dB in Webb's (was 0.08)
            const [feedRate, setFeedRate] = useState(0.054);  // f default
            const [killRate, setKillRate] = useState(0.062);  // k default

            // Diffusiophoresis parameters
            const [diffusionCoeff, setDiffusionCoeff] = useState(0.1);
            const [gradientStrength, setGradientStrength] = useState(0.5);
            const [mobility, setMobility] = useState(0.3);

            // Visualization
            const [colorScheme, setColorScheme] = useState('rainbow');
            const [speed, setSpeed] = useState(1);
            const [initialPattern, setInitialPattern] = useState('center');
            const [highContrast, setHighContrast] = useState(false);
            const [iterationsPerFrame, setIterationsPerFrame] = useState(5);  // Multiple steps per render

            // Zoom and pan
            const [zoom, setZoom] = useState(1.0);
            const [panX, setPanX] = useState(0);
            const [panY, setPanY] = useState(0);
            const isDragging = useRef(false);
            const lastMousePos = useRef({ x: 0, y: 0 });

            // Fullscreen
            const [isFullscreen, setIsFullscreen] = useState(false);
            const dragStartPos = useRef({ x: 0, y: 0 });

            // Mouse painting
            const [isPainting, setIsPainting] = useState(false);
            const [brushSize, setBrushSize] = useState(30);
            const [brushStrength, setBrushStrength] = useState(1.0);

            // Initialize WebGPU only if using GPU backend
            useEffect(() => {
                if (useBackend === 'gpu') {
                    initWebGPU();
                } else {
                    // CPU mode - just initialize grids directly
                    initializeGrids();
                }
            }, [useBackend]);

            const initWebGPU = async () => {
                try {
                    if (!navigator.gpu) {
                        throw new Error('WebGPU not supported. Please use Chrome/Edge 113+ or Safari 18+');
                    }

                    const adapter = await navigator.gpu.requestAdapter();
                    if (!adapter) {
                        throw new Error('No GPU adapter found');
                    }

                    const device = await adapter.requestDevice();
                    const canvas = canvasRef.current;

                    if (!canvas) {
                        throw new Error('Canvas not found. Please try reloading the page.');
                    }

                    const context = canvas.getContext('webgpu');

                    if (!context) {
                        throw new Error('Failed to get WebGPU context. Your browser may not have WebGPU fully enabled. Try chrome://flags and enable "Unsafe WebGPU"');
                    }

                    const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
                    context.configure({
                        device,
                        format: presentationFormat,
                        alphaMode: 'opaque',
                    });

                    // Create compute shader for Gray-Scott
                    const grayScottShader = device.createShaderModule({
                        code: `
                            struct Params {
                                gridSize: u32,
                                Du: f32,
                                Dv: f32,
                                feedRate: f32,
                                killRate: f32,
                                dt: f32,
                            }

                            @group(0) @binding(0) var<storage, read> gridA: array<f32>;
                            @group(0) @binding(1) var<storage, read> gridB: array<f32>;
                            @group(0) @binding(2) var<storage, read_write> nextGridA: array<f32>;
                            @group(0) @binding(3) var<storage, read_write> nextGridB: array<f32>;
                            @group(0) @binding(4) var<uniform> params: Params;

                            @compute @workgroup_size(8, 8)
                            fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
                                let x = global_id.x;
                                let y = global_id.y;
                                let gridSize = params.gridSize;

                                if (x >= gridSize || y >= gridSize) {
                                    return;
                                }

                                let idx = y * gridSize + x;

                                // Neighbors with periodic boundary conditions
                                let left = y * gridSize + ((x + gridSize - 1u) % gridSize);
                                let right = y * gridSize + ((x + 1u) % gridSize);
                                let up = ((y + gridSize - 1u) % gridSize) * gridSize + x;
                                let down = ((y + 1u) % gridSize) * gridSize + x;

                                let a = gridA[idx];
                                let b = gridB[idx];

                                // Laplacian
                                let laplaceA = gridA[left] + gridA[right] + gridA[up] + gridA[down] - 4.0 * a;
                                let laplaceB = gridB[left] + gridB[right] + gridB[up] + gridB[down] - 4.0 * b;

                                // Gray-Scott equations
                                let reaction = a * b * b;
                                let newA = a + (params.Du * laplaceA - reaction + params.feedRate * (1.0 - a)) * params.dt;
                                let newB = b + (params.Dv * laplaceB + reaction - (params.killRate + params.feedRate) * b) * params.dt;

                                nextGridA[idx] = clamp(newA, 0.0, 1.0);
                                nextGridB[idx] = clamp(newB, 0.0, 1.0);
                            }
                        `
                    });

                    // Create compute shader for Diffusiophoresis
                    const diffusiophoresisSha = device.createShaderModule({
                        code: `
                            struct Params {
                                gridSize: u32,
                                diffusionCoeff: f32,
                                gradientStrength: f32,
                                mobility: f32,
                                dt: f32,
                            }

                            @group(0) @binding(0) var<storage, read> gridA: array<f32>;
                            @group(0) @binding(1) var<storage, read> gridB: array<f32>;
                            @group(0) @binding(2) var<storage, read_write> nextGridA: array<f32>;
                            @group(0) @binding(3) var<storage, read_write> nextGridB: array<f32>;
                            @group(0) @binding(4) var<uniform> params: Params;

                            @compute @workgroup_size(8, 8)
                            fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
                                let x = global_id.x;
                                let y = global_id.y;
                                let gridSize = params.gridSize;

                                if (x >= gridSize || y >= gridSize) {
                                    return;
                                }

                                let idx = y * gridSize + x;

                                let left = y * gridSize + ((x + gridSize - 1u) % gridSize);
                                let right = y * gridSize + ((x + 1u) % gridSize);
                                let up = ((y + gridSize - 1u) % gridSize) * gridSize + x;
                                let down = ((y + 1u) % gridSize) * gridSize + x;

                                let a = gridA[idx];
                                let b = gridB[idx];

                                let laplaceA = gridA[left] + gridA[right] + gridA[up] + gridA[down] - 4.0 * a;
                                let laplaceB = gridB[left] + gridB[right] + gridB[up] + gridB[down] - 4.0 * b;

                                // Gradient calculation
                                let gradX = (gridA[right] - gridA[left]) * 0.5;
                                let gradY = (gridA[down] - gridA[up]) * 0.5;
                                let gradMag = sqrt(gradX * gradX + gradY * gradY);

                                // Diffusiophoresis
                                let phoretic = params.gradientStrength * gradMag * b;

                                let newA = a + params.diffusionCoeff * laplaceA * params.dt;
                                let newB = b + (params.diffusionCoeff * 0.5 * laplaceB + params.mobility * phoretic) * params.dt;

                                nextGridA[idx] = clamp(newA, 0.0, 1.0);
                                nextGridB[idx] = clamp(newB, 0.0, 1.0);
                            }
                        `
                    });

                    // Create render shader
                    const renderShader = device.createShaderModule({
                        code: `
                            struct VertexOutput {
                                @builtin(position) position: vec4<f32>,
                                @location(0) texCoord: vec2<f32>,
                            }

                            @vertex
                            fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
                                var pos = array<vec2<f32>, 6>(
                                    vec2<f32>(-1.0, -1.0),
                                    vec2<f32>(1.0, -1.0),
                                    vec2<f32>(-1.0, 1.0),
                                    vec2<f32>(-1.0, 1.0),
                                    vec2<f32>(1.0, -1.0),
                                    vec2<f32>(1.0, 1.0)
                                );

                                var texCoord = array<vec2<f32>, 6>(
                                    vec2<f32>(0.0, 1.0),
                                    vec2<f32>(1.0, 1.0),
                                    vec2<f32>(0.0, 0.0),
                                    vec2<f32>(0.0, 0.0),
                                    vec2<f32>(1.0, 1.0),
                                    vec2<f32>(1.0, 0.0)
                                );

                                var output: VertexOutput;
                                output.position = vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                                output.texCoord = texCoord[vertexIndex];
                                return output;
                            }

                            struct RenderParams {
                                gridSize: u32,
                                colorScheme: u32,
                                zoom: f32,
                                panX: f32,
                                panY: f32,
                                highContrast: u32,
                            }

                            @group(0) @binding(0) var<storage, read> gridB: array<f32>;
                            @group(0) @binding(1) var<uniform> renderParams: RenderParams;

                            fn viridis(t: f32) -> vec3<f32> {
                                let c0 = vec3<f32>(0.267004, 0.004874, 0.329415);
                                let c1 = vec3<f32>(0.127568, 0.566949, 0.550556);
                                let c2 = vec3<f32>(0.993248, 0.906157, 0.143936);

                                let t2 = t * t;
                                let t3 = t2 * t;
                                return c0 + c1 * t + c2 * t2;
                            }

                            fn plasma(t: f32) -> vec3<f32> {
                                let c0 = vec3<f32>(0.050383, 0.029803, 0.527975);
                                let c1 = vec3<f32>(0.759954, 0.513937, 0.424850);
                                let c2 = vec3<f32>(0.940015, 0.750425, 0.015609);

                                let t2 = t * t;
                                return c0 + c1 * t + c2 * t2;
                            }

                            fn rainbow(t: f32) -> vec3<f32> {
                                // Rainbow spectrum using HSV to RGB
                                let h = t * 300.0; // Hue in degrees (0-300)
                                let s = 1.0;       // Saturation
                                let v = 1.0;       // Value

                                let c = v * s;
                                let x = c * (1.0 - abs((h / 60.0) % 2.0 - 1.0));
                                let m = v - c;

                                var rgb: vec3<f32>;
                                if (h < 60.0) {
                                    rgb = vec3<f32>(c, x, 0.0);
                                } else if (h < 120.0) {
                                    rgb = vec3<f32>(x, c, 0.0);
                                } else if (h < 180.0) {
                                    rgb = vec3<f32>(0.0, c, x);
                                } else if (h < 240.0) {
                                    rgb = vec3<f32>(0.0, x, c);
                                } else {
                                    rgb = vec3<f32>(x, 0.0, c);
                                }

                                return rgb + vec3<f32>(m, m, m);
                            }

                            fn applyContrast(value: f32, enabled: bool) -> f32 {
                                if (!enabled) {
                                    return value;
                                }
                                // High contrast: emphasize differences using power curve
                                let centered = (value - 0.5) * 2.0; // Map to [-1, 1]
                                let boosted = sign(centered) * pow(abs(centered), 0.5); // Apply power curve
                                return (boosted + 1.0) / 2.0; // Map back to [0, 1]
                            }

                            @fragment
                            fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
                                let gridSize = renderParams.gridSize;
                                let zoom = renderParams.zoom;
                                let panX = renderParams.panX;
                                let panY = renderParams.panY;

                                // Calculate visible region based on zoom and pan
                                let viewWidth = f32(gridSize) / zoom;
                                let viewHeight = f32(gridSize) / zoom;
                                let startX = f32(gridSize) / 2.0 - viewWidth / 2.0 + panX;
                                let startY = f32(gridSize) / 2.0 - viewHeight / 2.0 + panY;

                                // Map texture coordinate to grid position with zoom/pan
                                let gx = startX + input.texCoord.x * viewWidth;
                                let gy = startY + input.texCoord.y * viewHeight;

                                // Wrap around edges (periodic boundary)
                                let wx = u32((gx + f32(gridSize * 1000)) % f32(gridSize));
                                let wy = u32((gy + f32(gridSize * 1000)) % f32(gridSize));
                                let idx = wy * gridSize + wx;

                                let rawValue = gridB[idx];
                                let value = applyContrast(rawValue, renderParams.highContrast != 0u);

                                var color: vec3<f32>;
                                if (renderParams.colorScheme == 0u) {
                                    color = viridis(value);
                                } else if (renderParams.colorScheme == 1u) {
                                    color = plasma(value);
                                } else if (renderParams.colorScheme == 2u) {
                                    color = rainbow(value);
                                } else {
                                    color = vec3<f32>(value, value, value);
                                }

                                return vec4<f32>(color, 1.0);
                            }
                        `
                    });

                    // Create buffers
                    const bufferSize = gridSize * gridSize * 4; // Float32

                    const gridABuffer = device.createBuffer({
                        size: bufferSize,
                        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
                    });

                    const gridBBuffer = device.createBuffer({
                        size: bufferSize,
                        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
                    });

                    const nextGridABuffer = device.createBuffer({
                        size: bufferSize,
                        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
                    });

                    const nextGridBBuffer = device.createBuffer({
                        size: bufferSize,
                        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
                    });

                    // Params buffers
                    const grayScottParamsBuffer = device.createBuffer({
                        size: 24, // 6 floats
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                    });

                    const diffusiophoresisPramsBuffer = device.createBuffer({
                        size: 20, // 5 floats
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                    });

                    const renderParamsBuffer = device.createBuffer({
                        size: 24, // 3 u32s + 3 f32s = 12 + 12 = 24 bytes
                        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                    });

                    // Create compute pipelines
                    const grayScottPipeline = device.createComputePipeline({
                        layout: 'auto',
                        compute: {
                            module: grayScottShader,
                            entryPoint: 'main',
                        }
                    });

                    const diffusiophoresisPipeline = device.createComputePipeline({
                        layout: 'auto',
                        compute: {
                            module: diffusiophoresisSha,
                            entryPoint: 'main',
                        }
                    });

                    // Create bind groups
                    const grayScottBindGroup = device.createBindGroup({
                        layout: grayScottPipeline.getBindGroupLayout(0),
                        entries: [
                            { binding: 0, resource: { buffer: gridABuffer } },
                            { binding: 1, resource: { buffer: gridBBuffer } },
                            { binding: 2, resource: { buffer: nextGridABuffer } },
                            { binding: 3, resource: { buffer: nextGridBBuffer } },
                            { binding: 4, resource: { buffer: grayScottParamsBuffer } },
                        ],
                    });

                    const diffusiophoresiBindGroup = device.createBindGroup({
                        layout: diffusiophoresisPipeline.getBindGroupLayout(0),
                        entries: [
                            { binding: 0, resource: { buffer: gridABuffer } },
                            { binding: 1, resource: { buffer: gridBBuffer } },
                            { binding: 2, resource: { buffer: nextGridABuffer } },
                            { binding: 3, resource: { buffer: nextGridBBuffer } },
                            { binding: 4, resource: { buffer: diffusiophoresisPramsBuffer } },
                        ],
                    });

                    // Create render pipeline
                    const renderPipeline = device.createRenderPipeline({
                        layout: 'auto',
                        vertex: {
                            module: renderShader,
                            entryPoint: 'vertexMain',
                        },
                        fragment: {
                            module: renderShader,
                            entryPoint: 'fragmentMain',
                            targets: [{
                                format: presentationFormat,
                            }],
                        },
                        primitive: {
                            topology: 'triangle-list',
                        },
                    });

                    const renderBindGroup = device.createBindGroup({
                        layout: renderPipeline.getBindGroupLayout(0),
                        entries: [
                            { binding: 0, resource: { buffer: gridBBuffer } },
                            { binding: 1, resource: { buffer: renderParamsBuffer } },
                        ],
                    });

                    gpuRef.current = {
                        device,
                        context,
                        gridABuffer,
                        gridBBuffer,
                        nextGridABuffer,
                        nextGridBBuffer,
                        grayScottParamsBuffer,
                        diffusiophoresisPramsBuffer,
                        renderParamsBuffer,
                        grayScottPipeline,
                        diffusiophoresisPipeline,
                        renderPipeline,
                        grayScottBindGroup,
                        diffusiophoresiBindGroup,
                        renderBindGroup,
                    };

                    initializeGrids();
                } catch (error) {
                    console.error('WebGPU initialization failed:', error);
                    setGpuError(error.message);
                }
            };

            const initializeGrids = (pattern = initialPattern) => {
                if (useBackend === 'gpu' && !gpuRef.current) return;

                const size = gridSize * gridSize;
                const gridA = new Float32Array(size);
                const gridB = new Float32Array(size);

                // Initialize base state
                for (let i = 0; i < size; i++) {
                    gridA[i] = 1.0;
                    gridB[i] = 0.0;
                }

                const seedRadius = 10; // Optimal seed radius for 256 grid (tested)

                switch(pattern) {
                    case 'center':
                        // Single spot in center
                        const centerX = Math.floor(gridSize / 2);
                        const centerY = Math.floor(gridSize / 2);
                        for (let dy = -seedRadius; dy <= seedRadius; dy++) {
                            for (let dx = -seedRadius; dx <= seedRadius; dx++) {
                                if (dx * dx + dy * dy <= seedRadius * seedRadius) {
                                    const x = (centerX + dx + gridSize) % gridSize;
                                    const y = (centerY + dy + gridSize) % gridSize;
                                    const idx = y * gridSize + x;
                                    gridB[idx] = 1.0;
                                }
                            }
                        }
                        break;

                    case 'random':
                        // Random noise - VERY sparse and weak to allow pattern formation
                        // Self-replicating patterns need minimal seeds or they overwhelm
                        for (let i = 0; i < size; i++) {
                            if (Math.random() < 0.02) {  // Only 2% of cells
                                gridB[i] = 0.05 + Math.random() * 0.1;  // 0.05 to 0.15 (very weak)
                            }
                        }
                        break;

                    case 'grid':
                        // Grid pattern
                        const spacing = 80;  // Adjusted for 256 grid
                        const gridSpotRadius = 10;
                        for (let y = 0; y < gridSize; y += spacing) {
                            for (let x = 0; x < gridSize; x += spacing) {
                                for (let dy = -gridSpotRadius; dy <= gridSpotRadius; dy++) {
                                    for (let dx = -gridSpotRadius; dx <= gridSpotRadius; dx++) {
                                        if (dx * dx + dy * dy <= gridSpotRadius * gridSpotRadius) {
                                            const px = (x + dx + gridSize) % gridSize;
                                            const py = (y + dy + gridSize) % gridSize;
                                            const idx = py * gridSize + px;
                                            gridB[idx] = 1.0;
                                        }
                                    }
                                }
                            }
                        }
                        break;

                    case 'stripes':
                        // Vertical stripes
                        for (let y = 0; y < gridSize; y++) {
                            for (let x = 0; x < gridSize; x++) {
                                if ((x % 60) < 15) {  // Adjusted for 256 grid
                                    const idx = y * gridSize + x;
                                    gridB[idx] = 1.0;
                                }
                            }
                        }
                        break;

                    case 'corners':
                        // Four corners
                        const offset = 50;  // Adjusted for 256 grid
                        const corners = [
                            [offset, offset],
                            [gridSize - offset, offset],
                            [offset, gridSize - offset],
                            [gridSize - offset, gridSize - offset]
                        ];
                        for (const [cx, cy] of corners) {
                            for (let dy = -seedRadius; dy <= seedRadius; dy++) {
                                for (let dx = -seedRadius; dx <= seedRadius; dx++) {
                                    if (dx * dx + dy * dy <= seedRadius * seedRadius) {
                                        const x = (cx + dx + gridSize) % gridSize;
                                        const y = (cy + dy + gridSize) % gridSize;
                                        const idx = y * gridSize + x;
                                        gridB[idx] = 1.0;
                                    }
                                }
                            }
                        }
                        break;

                    case 'ring':
                        // Ring pattern
                        const ringCenterX = Math.floor(gridSize / 2);
                        const ringCenterY = Math.floor(gridSize / 2);
                        const ringRadius = 50;  // Adjusted for 256 grid
                        const ringWidth = 10;
                        for (let y = 0; y < gridSize; y++) {
                            for (let x = 0; x < gridSize; x++) {
                                const dx = x - ringCenterX;
                                const dy = y - ringCenterY;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (Math.abs(dist - ringRadius) < ringWidth) {
                                    const idx = y * gridSize + x;
                                    gridB[idx] = 1.0;
                                }
                            }
                        }
                        break;

                    case 'diagonal':
                        // Diagonal stripe
                        for (let y = 0; y < gridSize; y++) {
                            for (let x = 0; x < gridSize; x++) {
                                if (Math.abs((x - y + gridSize) % gridSize) < 15) {  // Adjusted for 256 grid
                                    const idx = y * gridSize + x;
                                    gridB[idx] = 1.0;
                                }
                            }
                        }
                        break;

                    case 'sparse':
                        // Sparse seeds - ideal for self-replicating patterns
                        // Places a few well-separated spots
                        const seedPositions = [
                            [gridSize * 0.25, gridSize * 0.25],
                            [gridSize * 0.75, gridSize * 0.25],
                            [gridSize * 0.5, gridSize * 0.5],
                            [gridSize * 0.25, gridSize * 0.75],
                            [gridSize * 0.75, gridSize * 0.75],
                        ];
                        for (const [sx, sy] of seedPositions) {
                            const cx = Math.floor(sx);
                            const cy = Math.floor(sy);
                            for (let dy = -seedRadius; dy <= seedRadius; dy++) {
                                for (let dx = -seedRadius; dx <= seedRadius; dx++) {
                                    if (dx * dx + dy * dy <= seedRadius * seedRadius) {
                                        const x = (cx + dx + gridSize) % gridSize;
                                        const y = (cy + dy + gridSize) % gridSize;
                                        const idx = y * gridSize + x;
                                        gridB[idx] = 1.0;
                                    }
                                }
                            }
                        }
                        break;
                }

                // Log initial values for debugging
                console.log('=== GRID INITIALIZATION ===');
                console.log('Backend:', useBackend.toUpperCase());
                console.log('Grid size:', gridSize);
                console.log('Total cells:', gridSize * gridSize);
                console.log('Center index:', Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2));
                console.log('GridA sample (center):', gridA[Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2)]);
                console.log('GridB sample (center):', gridB[Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2)]);

                // Find min/max without spread operator (to avoid stack overflow on large grids)
                let minB = gridB[0], maxB = gridB[0], sumB = 0;
                for (let i = 0; i < gridB.length; i++) {
                    if (gridB[i] < minB) minB = gridB[i];
                    if (gridB[i] > maxB) maxB = gridB[i];
                    sumB += gridB[i];
                }
                console.log('GridB min:', minB);
                console.log('GridB max:', maxB);
                console.log('GridB average:', sumB / gridB.length);

                if (useBackend === 'gpu') {
                    const { device, gridABuffer, gridBBuffer } = gpuRef.current;
                    device.queue.writeBuffer(gridABuffer, 0, gridA);
                    device.queue.writeBuffer(gridBBuffer, 0, gridB);
                } else {
                    // CPU mode
                    cpuGridA.current = gridA;
                    cpuGridB.current = gridB;
                    cpuNextGridA.current = new Float32Array(size);
                    cpuNextGridB.current = new Float32Array(size);
                    console.log('✓ CPU grids initialized successfully');
                    console.log('  Grid size:', gridSize, 'x', gridSize);
                    console.log('  Total cells:', size);
                    console.log('  Center value B:', gridB[Math.floor(size/2)]);
                }

                // Render the initial state
                renderFrame();
            };

            const renderFrame = () => {
                if (useBackend === 'gpu' && !gpuRef.current) return;
                if (useBackend === 'cpu' && !cpuGridB.current) return;

                if (useBackend === 'cpu') {
                    // CPU rendering using Canvas 2D
                    const canvas = canvasRef.current;

                    // Try to get 2D context, with better error handling
                    let ctx = null;
                    try {
                        ctx = canvas.getContext('2d');
                    } catch (e) {
                        console.error('Failed to get 2D context:', e);
                    }

                    // If canvas was configured for WebGPU, we can't get 2D context
                    if (!ctx) {
                        console.error('Cannot get 2D context - canvas may be configured for WebGPU.');
                        console.error('Attempting to recreate canvas...');

                        // Try to recreate the canvas for 2D rendering
                        const parent = canvas.parentElement;
                        const newCanvas = document.createElement('canvas');
                        newCanvas.width = gridSize;
                        newCanvas.height = gridSize;
                        parent.replaceChild(newCanvas, canvas);
                        canvasRef.current = newCanvas;
                        ctx = newCanvas.getContext('2d');

                        if (!ctx) {
                            console.error('Still cannot get 2D context. Please reload the page.');
                            return;
                        }
                    }

                    const imageData = ctx.createImageData(gridSize, gridSize);
                    const data = imageData.data;

                    // Sample some values for debugging
                    const centerIdx = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2);

                    // Find min/max without spread operator (avoids stack overflow on large grids)
                    let minB = cpuGridB.current[0], maxB = cpuGridB.current[0];
                    for (let i = 0; i < cpuGridB.current.length; i++) {
                        if (cpuGridB.current[i] < minB) minB = cpuGridB.current[i];
                        if (cpuGridB.current[i] > maxB) maxB = cpuGridB.current[i];
                    }

                    const sampleValues = {
                        center: cpuGridB.current[centerIdx],
                        min: minB,
                        max: maxB
                    };

                    // Calculate visible region based on zoom and pan
                    const viewWidth = gridSize / zoom;
                    const viewHeight = gridSize / zoom;
                    const startX = Math.floor(gridSize / 2 - viewWidth / 2 + panX);
                    const startY = Math.floor(gridSize / 2 - viewHeight / 2 + panY);

                    for (let py = 0; py < gridSize; py++) {
                        for (let px = 0; px < gridSize; px++) {
                            // Map canvas pixel to grid position with zoom/pan
                            const gx = Math.floor(startX + px * viewWidth / gridSize);
                            const gy = Math.floor(startY + py * viewHeight / gridSize);

                            // Wrap around edges (periodic boundary)
                            const wx = ((gx % gridSize) + gridSize) % gridSize;
                            const wy = ((gy % gridSize) + gridSize) % gridSize;

                            const idx = wy * gridSize + wx;
                            const b = cpuGridB.current[idx];
                            const color = getColor(b, colorScheme);

                            const pixelIdx = (py * gridSize + px) * 4;
                            data[pixelIdx] = color.r;
                            data[pixelIdx + 1] = color.g;
                            data[pixelIdx + 2] = color.b;
                            data[pixelIdx + 3] = 255;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);

                    // Log rendering info occasionally
                    if (!window.renderCallCount) window.renderCallCount = 0;
                    window.renderCallCount++;
                    if (window.renderCallCount === 1 || window.renderCallCount % 100 === 0) {
                        console.log(`🎨 Render #${window.renderCallCount}: GridB range [${sampleValues.min.toFixed(3)}, ${sampleValues.max.toFixed(3)}], center=${sampleValues.center.toFixed(3)}`);
                    }
                } else {
                    // GPU rendering using WebGPU
                    const {
                        device,
                        context,
                        gridBBuffer,
                        renderParamsBuffer,
                        renderPipeline,
                        renderBindGroup,
                    } = gpuRef.current;

                    // Update render params with zoom/pan
                    const colorSchemeMap = { 'viridis': 0, 'plasma': 1, 'rainbow': 2, 'grayscale': 3 };
                    const renderParamsData = new ArrayBuffer(24);
                    const renderView = new DataView(renderParamsData);
                    renderView.setUint32(0, gridSize, true);
                    renderView.setUint32(4, colorSchemeMap[colorScheme] || 0, true);
                    renderView.setFloat32(8, zoom, true);
                    renderView.setFloat32(12, panX, true);
                    renderView.setFloat32(16, panY, true);
                    renderView.setUint32(20, highContrast ? 1 : 0, true);
                    device.queue.writeBuffer(renderParamsBuffer, 0, renderParamsData);

                    const commandEncoder = device.createCommandEncoder();
                    const renderPass = commandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store',
                        }],
                    });
                    renderPass.setPipeline(renderPipeline);
                    renderPass.setBindGroup(0, renderBindGroup);
                    renderPass.draw(6);
                    renderPass.end();

                    device.queue.submit([commandEncoder.finish()]);
                }
            };

            const reset = () => {
                setIsRunning(false);
                initializeGrids();
            };

            const resetView = () => {
                setZoom(1.0);
                setPanX(0);
                setPanY(0);
            };

            // Mouse event handlers for painting and panning
            const handleMouseDown = (e) => {
                isDragging.current = true;
                dragStartPos.current = { x: e.clientX, y: e.clientY };
                lastMousePos.current = { x: e.clientX, y: e.clientY };

                // Start painting if painting mode is enabled
                if (isPainting) {
                    paintAtMousePosition(e);
                }
            };

            const handleMouseMove = (e) => {
                if (!isDragging.current) return;

                if (isPainting) {
                    // Paint mode: inject chemical B
                    paintAtMousePosition(e);
                } else {
                    // Pan mode: move viewport
                    const dx = e.clientX - lastMousePos.current.x;
                    const dy = e.clientY - lastMousePos.current.y;
                    lastMousePos.current = { x: e.clientX, y: e.clientY };
                    setPanX(prev => prev - dx / zoom);
                    setPanY(prev => prev - dy / zoom);
                }
            };

            const handleMouseUp = (e) => {
                isDragging.current = false;
            };

            const paintAtMousePosition = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const rect = canvas.getBoundingClientRect();
                const canvasX = e.clientX - rect.left;
                const canvasY = e.clientY - rect.top;

                // Convert canvas coordinates to grid coordinates, accounting for zoom/pan
                const canvasWidth = rect.width;
                const canvasHeight = rect.height;
                const gridX = (canvasX / canvasWidth) * gridSize;
                const gridY = (canvasY / canvasHeight) * gridSize;

                // Account for zoom and pan
                const viewWidth = gridSize / zoom;
                const viewHeight = gridSize / zoom;
                const startX = gridSize / 2 - viewWidth / 2 + panX;
                const startY = gridSize / 2 - viewHeight / 2 + panY;

                const actualX = Math.floor(startX + (gridX / gridSize) * viewWidth);
                const actualY = Math.floor(startY + (gridY / gridSize) * viewHeight);

                // Paint in a circular brush area
                if (useBackend === 'cpu' && cpuGridB.current) {
                    for (let dy = -brushSize; dy <= brushSize; dy++) {
                        for (let dx = -brushSize; dx <= brushSize; dx++) {
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist <= brushSize) {
                                const x = ((actualX + dx) % gridSize + gridSize) % gridSize;
                                const y = ((actualY + dy) % gridSize + gridSize) % gridSize;
                                const idx = y * gridSize + x;

                                // Smooth falloff from center
                                const falloff = 1.0 - (dist / brushSize);
                                const amount = brushStrength * falloff;
                                cpuGridB.current[idx] = Math.min(1.0, cpuGridB.current[idx] + amount);
                            }
                        }
                    }
                    renderFrame();
                } else if (useBackend === 'gpu' && gpuRef.current) {
                    // For GPU, we'd need to update the buffer - simpler to just support CPU painting for now
                    // Could add GPU painting support later with a compute shader
                    console.log('GPU painting not yet implemented - switch to CPU mode for interactive painting');
                }
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const zoomDelta = e.deltaY > 0 ? 0.9 : 1.1;
                setZoom(prev => Math.max(1, Math.min(20, prev * zoomDelta)));
            };

            // ESC key to exit fullscreen
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isFullscreen) {
                        setIsFullscreen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isFullscreen]);

            const applyPreset = (preset) => {
                // All 24 presets from Jason Webb's reaction-diffusion playground
                // Diffusion rates fixed to Webb's defaults, varying f and k for different patterns
                setDu(0.2097);
                setDv(0.105);

                switch(preset) {
                    case 'waves':
                        setFeedRate(0.014);
                        setKillRate(0.045);
                        break;
                    case 'moving-spots':
                        setFeedRate(0.014);
                        setKillRate(0.054);
                        break;
                    case 'spots-loops':
                        setFeedRate(0.018);
                        setKillRate(0.051);
                        break;
                    case 'warring-microbes':
                        setFeedRate(0.022);
                        setKillRate(0.059);
                        break;
                    case 'pulsating-solitons':
                        setFeedRate(0.025);
                        setKillRate(0.06);
                        break;
                    case 'chaos':
                        setFeedRate(0.026);
                        setKillRate(0.051);
                        break;
                    case 'mazes-chaos':
                        setFeedRate(0.026);
                        setKillRate(0.055);
                        break;
                    case 'mazes':
                        setFeedRate(0.029);
                        setKillRate(0.057);
                        break;
                    case 'super-resonant-mazes':
                        setFeedRate(0.03);
                        setKillRate(0.0565);
                        break;
                    case 'self-replicating-spots':
                        setFeedRate(0.03);
                        setKillRate(0.063);
                        break;
                    case 'spots-worms':
                        setFeedRate(0.034);
                        setKillRate(0.0618);
                        break;
                    case 'chaos-negatons':
                        setFeedRate(0.0353);
                        setKillRate(0.0566);
                        break;
                    case 'fingerprints':
                        setFeedRate(0.037);
                        setKillRate(0.06);
                        break;
                    case 'chaos-turing-negatons':
                        setFeedRate(0.039);
                        setKillRate(0.058);
                        break;
                    case 'turing-patterns':
                        setFeedRate(0.042);
                        setKillRate(0.059);
                        break;
                    case 'negatons':
                        setFeedRate(0.046);
                        setKillRate(0.0594);
                        break;
                    case 'worms-join-maze':
                        setFeedRate(0.046);
                        setKillRate(0.063);
                        break;
                    case 'worms':
                        setFeedRate(0.058);
                        setKillRate(0.065);
                        break;
                    case 'u-skate-world':
                        setFeedRate(0.062);
                        setKillRate(0.0609);
                        break;
                    case 'stable-solitons':
                        setFeedRate(0.074);
                        setKillRate(0.064);
                        break;
                    case 'worms-loops':
                        setFeedRate(0.082);
                        setKillRate(0.06);
                        break;
                    case 'precritical-bubbles':
                        setFeedRate(0.082);
                        setKillRate(0.059);
                        break;
                    case 'positive-bubbles':
                        setFeedRate(0.098);
                        setKillRate(0.057);
                        break;
                    case 'negative-bubbles':
                        setFeedRate(0.098);
                        setKillRate(0.0555);
                        break;
                }
                reset();
            };

            // Color scheme functions for CPU rendering
            const viridisColor = (t) => {
                const c0 = [0.267004, 0.004874, 0.329415];
                const c1 = [0.127568, 0.566949, 0.550556];
                const c2 = [0.993248, 0.906157, 0.143936];
                const t2 = t * t;
                return {
                    r: Math.floor((c0[0] + c1[0] * t + c2[0] * t2) * 255),
                    g: Math.floor((c0[1] + c1[1] * t + c2[1] * t2) * 255),
                    b: Math.floor((c0[2] + c1[2] * t + c2[2] * t2) * 255)
                };
            };

            const plasmaColor = (t) => {
                const c0 = [0.050383, 0.029803, 0.527975];
                const c1 = [0.759954, 0.513937, 0.424850];
                const c2 = [0.940015, 0.750425, 0.015609];
                const t2 = t * t;
                return {
                    r: Math.floor((c0[0] + c1[0] * t + c2[0] * t2) * 255),
                    g: Math.floor((c0[1] + c1[1] * t + c2[1] * t2) * 255),
                    b: Math.floor((c0[2] + c1[2] * t + c2[2] * t2) * 255)
                };
            };

            const grayscaleColor = (t) => {
                const val = Math.floor(t * 255);
                return { r: val, g: val, b: val };
            };

            const rainbowColor = (t) => {
                // Rainbow spectrum: red → orange → yellow → green → cyan → blue → magenta
                // Using HSV to RGB conversion with hue from 0° (red) to 300° (magenta)
                const h = t * 300; // Hue in degrees (0-300, avoiding wrap to red)
                const s = 1.0;      // Full saturation
                const v = 1.0;      // Full value/brightness

                const c = v * s;
                const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                const m = v - c;

                let r, g, b;
                if (h < 60) {
                    r = c; g = x; b = 0;
                } else if (h < 120) {
                    r = x; g = c; b = 0;
                } else if (h < 180) {
                    r = 0; g = c; b = x;
                } else if (h < 240) {
                    r = 0; g = x; b = c;
                } else {
                    r = x; g = 0; b = c;
                }

                return {
                    r: Math.floor((r + m) * 255),
                    g: Math.floor((g + m) * 255),
                    b: Math.floor((b + m) * 255)
                };
            };

            const applyContrast = (value) => {
                if (!highContrast) return value;
                // High contrast: map [0,1] to emphasize differences
                // Using a power curve: values near 0.5 get pushed to extremes
                const centered = (value - 0.5) * 2; // Map to [-1, 1]
                const boosted = Math.sign(centered) * Math.pow(Math.abs(centered), 0.5); // Apply power curve
                return (boosted + 1) / 2; // Map back to [0, 1]
            };

            const getColor = (value, scheme) => {
                const contrastValue = applyContrast(value);
                if (scheme === 'viridis') return viridisColor(contrastValue);
                if (scheme === 'plasma') return plasmaColor(contrastValue);
                if (scheme === 'rainbow') return rainbowColor(contrastValue);
                return grayscaleColor(contrastValue);
            };

            // CPU simulation step for both Gray-Scott and Diffusiophoresis models
            const stepCPU = () => {
                if (!cpuGridA.current || !cpuGridB.current) {
                    console.error('CPU grids not initialized!');
                    return;
                }

                // Timestep matching Webb's implementation
                const dt = 1.0 * speed;

                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const idx = y * gridSize + x;
                        const left = y * gridSize + ((x - 1 + gridSize) % gridSize);
                        const right = y * gridSize + ((x + 1) % gridSize);
                        const up = ((y - 1 + gridSize) % gridSize) * gridSize + x;
                        const down = ((y + 1) % gridSize) * gridSize + x;

                        const a = cpuGridA.current[idx];
                        const b = cpuGridB.current[idx];

                        // Laplacian calculation
                        const laplaceA = cpuGridA.current[left] + cpuGridA.current[right] +
                                        cpuGridA.current[up] + cpuGridA.current[down] - 4 * a;
                        const laplaceB = cpuGridB.current[left] + cpuGridB.current[right] +
                                        cpuGridB.current[up] + cpuGridB.current[down] - 4 * b;

                        let newA, newB;

                        if (mode === 'turing') {
                            // Gray-Scott equations
                            const reaction = a * b * b;
                            newA = a + (Du * laplaceA - reaction + feedRate * (1 - a)) * dt;
                            newB = b + (Dv * laplaceB + reaction - (killRate + feedRate) * b) * dt;
                        } else {
                            // Diffusiophoresis
                            // Gradient calculation
                            const gradX = (cpuGridA.current[right] - cpuGridA.current[left]) * 0.5;
                            const gradY = (cpuGridA.current[down] - cpuGridA.current[up]) * 0.5;
                            const gradMag = Math.sqrt(gradX * gradX + gradY * gradY);

                            // Phoretic effect
                            const phoretic = gradientStrength * gradMag * b;

                            newA = a + diffusionCoeff * laplaceA * dt;
                            newB = b + (diffusionCoeff * 0.5 * laplaceB + mobility * phoretic) * dt;
                        }

                        // Clamp values to [0, 1] for stability (matching GPU shader behavior)
                        cpuNextGridA.current[idx] = Math.max(0, Math.min(1, newA));
                        cpuNextGridB.current[idx] = Math.max(0, Math.min(1, newB));

                        // Debug: check if values are being clamped properly
                        if (idx === Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2)) {
                            if (newA > 1.0 || newB > 1.0 || newA < 0 || newB < 0) {
                                console.warn(`⚠️ Clamping at center: newA=${newA.toFixed(6)}, newB=${newB.toFixed(6)} → clamped A=${cpuNextGridA.current[idx].toFixed(6)}, B=${cpuNextGridB.current[idx].toFixed(6)}`);
                            }
                        }
                    }
                }

                // Swap buffers (ping-pong)
                [cpuGridA.current, cpuNextGridA.current] = [cpuNextGridA.current, cpuGridA.current];
                [cpuGridB.current, cpuNextGridB.current] = [cpuNextGridB.current, cpuGridB.current];

                // Debug: check values after swap
                const centerIdx = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2);
                if (cpuGridB.current[centerIdx] > 1.0 || cpuGridB.current[centerIdx] < 0) {
                    console.error(`❌ After swap, center value is OUT OF BOUNDS: ${cpuGridB.current[centerIdx]}`);
                }
            };

            // Render when zoom/pan/color/contrast changes (even if not running)
            useEffect(() => {
                if (useBackend === 'gpu' && !gpuRef.current) return;
                if (useBackend === 'cpu' && !cpuGridB.current) return;
                renderFrame();
            }, [zoom, panX, panY, colorScheme, highContrast]);

            // Animation loop
            useEffect(() => {
                if (useBackend === 'gpu' && !gpuRef.current) return;
                if (useBackend === 'cpu' && !cpuGridB.current) return;
                if (!isRunning) return;

                console.log('🎬 Animation loop starting...', 'Backend:', useBackend, 'Mode:', mode);

                let frameCount = 0;

                const animate = () => {
                    if (useBackend === 'gpu' && !gpuRef.current) return;
                    if (useBackend === 'cpu' && !cpuGridB.current) return;

                    frameCount++;

                    if (useBackend === 'cpu') {
                        // CPU backend - run multiple simulation steps per frame for faster evolution
                        const centerIdx = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2);
                        const beforeValue = cpuGridB.current ? cpuGridB.current[centerIdx] : 'undefined';

                        // Run multiple iterations per frame (Webb's technique)
                        for (let i = 0; i < iterationsPerFrame; i++) {
                            stepCPU();
                        }
                        renderFrame();

                        const afterValue = cpuGridB.current ? cpuGridB.current[centerIdx] : 'undefined';

                        // Log CPU simulation state - more frequent logging for debugging
                        if (frameCount <= 5 || frameCount % 60 === 0) {
                            const dt = 1.0 * speed;
                            console.log(`=== FRAME ${frameCount} (CPU) ===`);
                            console.log(`Parameters: Du=${Du}, Dv=${Dv}, F=${feedRate}, k=${killRate}, dt=${dt}`);
                            console.log('Mode:', mode);
                            console.log(`CPU GridB center: before=${typeof beforeValue === 'number' ? beforeValue.toFixed(6) : beforeValue}, after=${typeof afterValue === 'number' ? afterValue.toFixed(6) : afterValue}`);

                            // Sample a few more points to check spreading
                            const offset10 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 10;
                            const offset20 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 20;
                            const offset50 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 50;
                            console.log(`  → GridB values (center, +10px, +20px, +50px): [${cpuGridB.current[centerIdx].toFixed(3)}, ${cpuGridB.current[offset10].toFixed(3)}, ${cpuGridB.current[offset20].toFixed(3)}, ${cpuGridB.current[offset50].toFixed(3)}]`);
                        }
                    } else {
                        // GPU backend
                        const {
                            device,
                            context,
                            gridABuffer,
                            gridBBuffer,
                            nextGridABuffer,
                            nextGridBBuffer,
                            grayScottParamsBuffer,
                            diffusiophoresisPramsBuffer,
                            renderParamsBuffer,
                            grayScottPipeline,
                            diffusiophoresisPipeline,
                            renderPipeline,
                            grayScottBindGroup,
                            diffusiophoresiBindGroup,
                            renderBindGroup,
                        } = gpuRef.current;

                        // Run simulation step - matched to Webb's for faster evolution
                        const dt = 1.0 * speed;

                    if (mode === 'turing') {
                        // Update Gray-Scott params with correct types (u32 for gridSize, f32 for rest)
                        const paramsData = new ArrayBuffer(24);
                        const view = new DataView(paramsData);
                        view.setUint32(0, gridSize, true); // gridSize as u32
                        view.setFloat32(4, Du, true);
                        view.setFloat32(8, Dv, true);
                        view.setFloat32(12, feedRate, true);
                        view.setFloat32(16, killRate, true);
                        view.setFloat32(20, dt, true);
                        device.queue.writeBuffer(grayScottParamsBuffer, 0, paramsData);
                    } else {
                        // Update diffusiophoresis params
                        const paramsData = new ArrayBuffer(20);
                        const view = new DataView(paramsData);
                        view.setUint32(0, gridSize, true);
                        view.setFloat32(4, diffusionCoeff, true);
                        view.setFloat32(8, gradientStrength, true);
                        view.setFloat32(12, mobility, true);
                        view.setFloat32(16, dt, true);
                        device.queue.writeBuffer(diffusiophoresisPramsBuffer, 0, paramsData);
                    }

                    // Run multiple iterations per frame (Webb's technique)
                    for (let iter = 0; iter < iterationsPerFrame; iter++) {
                        const commandEncoder = device.createCommandEncoder();

                        // Compute pass
                        if (mode === 'turing') {
                            const computePass = commandEncoder.beginComputePass();
                            computePass.setPipeline(grayScottPipeline);
                            computePass.setBindGroup(0, grayScottBindGroup);
                            computePass.dispatchWorkgroups(
                                Math.ceil(gridSize / 8),
                                Math.ceil(gridSize / 8)
                            );
                            computePass.end();
                        } else {
                            const computePass = commandEncoder.beginComputePass();
                            computePass.setPipeline(diffusiophoresisPipeline);
                            computePass.setBindGroup(0, diffusiophoresiBindGroup);
                            computePass.dispatchWorkgroups(
                                Math.ceil(gridSize / 8),
                                Math.ceil(gridSize / 8)
                            );
                            computePass.end();
                        }

                        // Copy next to current for ping-pong
                        commandEncoder.copyBufferToBuffer(nextGridABuffer, 0, gridABuffer, 0, gridSize * gridSize * 4);
                        commandEncoder.copyBufferToBuffer(nextGridBBuffer, 0, gridBBuffer, 0, gridSize * gridSize * 4);

                        device.queue.submit([commandEncoder.finish()]);
                    }

                    // Update render params with zoom/pan
                    const colorSchemeMap = { 'viridis': 0, 'plasma': 1, 'rainbow': 2, 'grayscale': 3 };
                    const renderParamsData = new ArrayBuffer(24);
                    const renderView = new DataView(renderParamsData);
                    renderView.setUint32(0, gridSize, true);
                    renderView.setUint32(4, colorSchemeMap[colorScheme] || 0, true);
                    renderView.setFloat32(8, zoom, true);
                    renderView.setFloat32(12, panX, true);
                    renderView.setFloat32(16, panY, true);
                    renderView.setUint32(20, highContrast ? 1 : 0, true);
                    device.queue.writeBuffer(renderParamsBuffer, 0, renderParamsData);

                    // Render (create new command encoder for rendering)
                    const renderCommandEncoder = device.createCommandEncoder();
                    const renderPass = renderCommandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store',
                        }],
                    });
                    renderPass.setPipeline(renderPipeline);
                    renderPass.setBindGroup(0, renderBindGroup);
                    renderPass.draw(6);
                    renderPass.end();

                    device.queue.submit([renderCommandEncoder.finish()]);

                    // Log simulation state and read back GPU values on first frame
                    if (frameCount === 1) {
                        console.log(`=== FRAME ${frameCount} ===`);
                        console.log(`Parameters: Du=${Du}, Dv=${Dv}, F=${feedRate}, k=${killRate}, dt=${dt}`);
                        console.log('Mode:', mode);

                        // Read back buffer values to check compute shader output
                        const readbackBuffer = device.createBuffer({
                            size: 4 * 4, // 4 floats
                            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
                        });

                        const centerIdx = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2);

                        const readEncoder = device.createCommandEncoder();
                        readEncoder.copyBufferToBuffer(gridBBuffer, centerIdx * 4, readbackBuffer, 0, 4);
                        device.queue.submit([readEncoder.finish()]);

                        readbackBuffer.mapAsync(GPUMapMode.READ).then(() => {
                            const data = new Float32Array(readbackBuffer.getMappedRange());
                            console.log('GPU GridB center value after Frame 1:', data[0]);
                            readbackBuffer.unmap();
                            readbackBuffer.destroy();
                        });
                    } else if (frameCount % 120 === 0) {
                        console.log(`=== FRAME ${frameCount} ===`);
                        console.log(`Parameters: Du=${Du}, Dv=${Dv}, F=${feedRate}, k=${killRate}, dt=${dt}`);

                        // Read back multiple points to see pattern evolution
                        const readbackBuffer = device.createBuffer({
                            size: 20,  // 5 floats
                            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
                        });

                        const centerIdx = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2);
                        const offset50 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 50; // 50 pixels right
                        const offset100 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 100;
                        const offset150 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 150;
                        const offset200 = Math.floor(gridSize/2) * gridSize + Math.floor(gridSize/2) + 200;

                        const readEncoder = device.createCommandEncoder();
                        readEncoder.copyBufferToBuffer(gridBBuffer, centerIdx * 4, readbackBuffer, 0, 4);
                        readEncoder.copyBufferToBuffer(gridBBuffer, offset50 * 4, readbackBuffer, 4, 4);
                        readEncoder.copyBufferToBuffer(gridBBuffer, offset100 * 4, readbackBuffer, 8, 4);
                        readEncoder.copyBufferToBuffer(gridBBuffer, offset150 * 4, readbackBuffer, 12, 4);
                        readEncoder.copyBufferToBuffer(gridBBuffer, offset200 * 4, readbackBuffer, 16, 4);
                        device.queue.submit([readEncoder.finish()]);

                        readbackBuffer.mapAsync(GPUMapMode.READ).then(() => {
                            const data = new Float32Array(readbackBuffer.getMappedRange());
                            console.log(`  → GridB values (center to +200px): [${data[0].toFixed(3)}, ${data[1].toFixed(3)}, ${data[2].toFixed(3)}, ${data[3].toFixed(3)}, ${data[4].toFixed(3)}]`);
                            readbackBuffer.unmap();
                            readbackBuffer.destroy();
                        });
                    }
                    } // End GPU backend

                    animationRef.current = requestAnimationFrame(animate);
                };

                animationRef.current = requestAnimationFrame(animate);

                return () => {
                    if (animationRef.current) {
                        cancelAnimationFrame(animationRef.current);
                    }
                };
            }, [isRunning, mode, useBackend, Du, Dv, feedRate, killRate, diffusionCoeff, gradientStrength, mobility, speed, colorScheme, gridSize, zoom, panX, panY, highContrast]);

            if (gpuError) {
                return (
                    <div className="container">
                        <div className="controls">
                            <h1>GPU Error</h1>
                            <div className="error-message">{gpuError}</div>
                            <p>WebGPU is required for this simulator. Please ensure you're using:</p>
                            <ul>
                                <li>Chrome/Edge 113 or later</li>
                                <li>Safari 18 or later (macOS Sonoma)</li>
                            </ul>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`container ${isFullscreen ? 'fullscreen' : ''}`}>
                    <div className="canvas-container">
                        <h1>Reaction-Diffusion Simulator</h1>
                        <div className="gpu-badge">{useBackend === 'gpu' ? 'GPU ACCELERATED' : 'CPU MODE'}</div>
                        <div className="canvas-wrapper">
                            <canvas
                                ref={canvasRef}
                                width={gridSize}
                                height={gridSize}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                onWheel={handleWheel}
                                style={{ cursor: isDragging.current ? 'grabbing' : 'grab' }}
                            />
                            <div className="fullscreen-hint">
                                {isPainting ? 'Paint Mode: Click and drag to inject chemical B' : 'Pan Mode: Click and drag to move viewport'}
                            </div>
                        </div>
                    </div>

                    <div className="controls">
                        <div className="control-group">
                            <label>Backend</label>
                            <select value={useBackend} onChange={(e) => {
                                const newBackend = e.target.value;
                                setIsRunning(false);

                                // Always recreate canvas when switching backends
                                // (can't switch between 2D and WebGPU contexts on same canvas)
                                if (newBackend !== useBackend) {
                                    const canvas = canvasRef.current;
                                    const parent = canvas.parentElement;
                                    const newCanvas = document.createElement('canvas');
                                    newCanvas.width = gridSize;
                                    newCanvas.height = gridSize;
                                    parent.replaceChild(newCanvas, canvas);
                                    canvasRef.current = newCanvas;

                                    // Clear GPU resources if switching away from GPU
                                    if (useBackend === 'gpu') {
                                        gpuRef.current = null;
                                    }
                                }

                                setUseBackend(newBackend);
                            }}>
                                <option value="cpu">CPU (JavaScript)</option>
                                <option value="gpu">GPU (WebGPU)</option>
                            </select>
                        </div>

                        <div className="control-group">
                            <label>Simulation Mode</label>
                            <select value={mode} onChange={(e) => { setMode(e.target.value); reset(); }}>
                                <option value="turing">Turing Patterns (Gray-Scott)</option>
                                <option value="diffusiophoresis">Diffusiophoresis</option>
                            </select>
                        </div>

                        <div className="button-group">
